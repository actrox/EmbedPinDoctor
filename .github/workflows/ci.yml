name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Audit hardware data
        run: python -m quality.data_audit
      - name: Verify generated demo data
        run: |
          python -m tools.build_demo_data
          npx prettier --write web/generated/demo-data.json
          git diff --exit-code -- web/generated/demo-data.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend quality tools
        run: npm ci
      - name: Lint browser JavaScript
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
